services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sensordb
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: sensor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sensor", "-d", "sensordb"]
      interval: 5s
      timeout: 3s
      retries: 10
  sensor-service:
    build: ./sensor-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sensordb
    depends_on: 
      postgres:
        condition: service_healthy

volumes:
  pgdata: