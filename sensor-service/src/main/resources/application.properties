spring.application.name=sensor-service
spring.datasource.url=jdbc:postgresql://localhost:5432/sensordb
spring.datasource.username=sensor
spring.datasource.password=sensor
management.endpoint.health.show-details=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
sensor.ingest.udp-port=9876
logging.level.com.sefa.sensor.ingest=DEBUG
spring.data.redis.timeout=500ms
spring.kafka.producer.properties.max.block.ms=500
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
