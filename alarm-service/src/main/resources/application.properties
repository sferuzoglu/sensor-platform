spring.application.name=alarm-service
server.port=8081
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.sefa.alarm.Measurement
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sefa.alarm
spring.kafka.consumer.auto-offset-reset=latest
logging.level.com.sefa.alarm=DEBUG